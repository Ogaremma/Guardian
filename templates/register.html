<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 60%, #3b82f6 100%);
            min-height: 100vh;
            color: white;
        }

        .card-register {
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.16);
            color: white;
            border-color: #93c5fd;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="/">Guardian</a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light" href="/login">Login</a>
                <a class="btn btn-light text-primary" href="/register">Register</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card-register shadow-lg p-5">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold">Create your Guardian account</h1>
                        <p class="text-white-75">Sign up with your username, alert email, website to monitor, and a
                            secure password.</p>
                    </div>

                    {% if message %}
                    <div class="alert alert-{{ message_type }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" type="text" name="username" placeholder="Enter a username"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Alert Email</label>
                            <input class="form-control" type="email" name="email" placeholder="you@example.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Website to Monitor</label>
                            <input class="form-control" type="url" name="website" placeholder="https://example.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" placeholder="Create a password"
                                required>
                        </div>

                        <button class="btn btn-light btn-lg w-100 fw-bold" type="submit">Register</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">Already have an account? <a class="text-white fw-bold" href="/login">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
