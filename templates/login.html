<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.35), transparent 20%),
                linear-gradient(135deg, #0d6efd 0%, #1d4ed8 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .form-card {
            border-radius: 30px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 32px 100px rgba(15, 23, 42, 0.32);
            background: rgba(255, 255, 255, 0.18);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Guardian</a>
            <div>
                <a class="btn btn-outline-light me-2" href="/register">Register</a>
                <a class="btn btn-light" href="/login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card form-card shadow-lg p-4 text-white">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold">Welcome Back</h1>
                        <p class="mb-0">Login to your Guardian account and continue monitoring your website alerts.</p>
                    </div>

                    {% if message %}
                    <div class="alert alert-{{ message_type }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    <form action="/login" method="POST" class="mt-3">
                        <div class="mb-3">
                            <label class="form-label text-white">Username</label>
                            <input class="form-control" type="text" name="username" placeholder="Username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white">Password</label>
                            <input class="form-control" type="password" name="password" placeholder="Password" required>
                        </div>

                        <button class="btn btn-light w-100 fw-bold" type="submit">Login</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">New to Guardian? <a class="text-white fw-bold" href="/register">Create an
                                account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginCard = document.querySelector('.form-card');
        loginCard?.addEventListener('mousemove', event => {
            const rect = loginCard.getBoundingClientRect();
            const x = (event.clientX - rect.left - rect.width / 2) / rect.width;
            const y = (event.clientY - rect.top - rect.height / 2) / rect.height;
            loginCard.style.transform = `translate3d(${x * 18}px, ${y * 18}px, 0) scale(1.01)`;
        });
        loginCard?.addEventListener('mouseleave', () => {
            loginCard.style.transform = '';
        });
    </script>
</body>

</html>
